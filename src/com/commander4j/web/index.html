<!DOCTYPE html>
<!-- Read-only web view of the sftpTransfer Put, Get and System log windows.

     Follows new entries on the /events SSE stream. Each time that stream (re)opens the
     page fetches every window's backlog from /api/log?dest=...&after=<last seq seen at that
     moment> and merges it in by sequence number, so lines written while the browser was
     away are recovered (up to the server's per-window buffer), and live frames which
     arrive while a backlog fetch is still in flight do not hide it. -->
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SFTP Transfer - Logs</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 1rem 1.25rem;
      color: #222; background: #f5f6f8;
    }
    header { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; margin-bottom: .6rem; }
    h1 { font-size: 1.2rem; margin: 0; }
    .sub { font-size: .85rem; color: #666; }

    .tabs { display: flex; gap: .3rem; margin-bottom: .5rem; flex-wrap: wrap; }
    .tab {
      border: 1px solid #ccd0d6; border-bottom: none; background: #e9ebef; color: #333;
      padding: .35rem .9rem; border-radius: 4px 4px 0 0; cursor: pointer; font-size: .85rem; user-select: none;
      display: inline-flex; align-items: center; gap: .4rem;
    }
    .tab:hover { background: #f2f3f5; }
    .tab.sel { background: #fff; font-weight: bold; }
    .badge { display: none; min-width: 1.3rem; padding: 0 .35rem; border-radius: 999px; background: #1f4e8c; color: #fff; font-size: .72rem; text-align: center; font-weight: normal; }
    .badge.on { display: inline-block; }
    .state { font-size: .72rem; color: #666; font-weight: normal; }

    .controls { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: .5rem; font-size: .85rem; }
    .controls input[type=search] { padding: .3rem .5rem; border: 1px solid #ccd0d6; border-radius: 4px; min-width: 15rem; font-size: .85rem; }
    .controls label { color: #555; display: inline-flex; align-items: center; gap: .3rem; }
    button { font-size: .85rem; padding: .3rem .7rem; border: 1px solid #ccd0d6; background: #fff; border-radius: 4px; cursor: pointer; }
    button:hover { border-color: #8a9099; }

    /* Same colours as the desktop log rows (JLogRow). */
    .log {
      display: none; background: #fff; border: 1px solid #ccd0d6; font-family: Arial, Helvetica, sans-serif;
      font-size: .82rem; line-height: 1.5; padding: .5rem .6rem; border-radius: 0 4px 4px 4px;
      height: 72vh; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    }
    .log.sel { display: block; }
    .log .ts { color: #777; margin-right: .6rem; }
    .log .l0 { color: #0000ff; }
    .log .l1 { color: #dc582a; }
    .log .l2 { color: #ff0000; }
    .log .l3 { color: #000000; }
    .log .l4 { color: #009900; }

    footer { margin-top: .5rem; font-size: .8rem; color: #666; display: flex; gap: 1rem; flex-wrap: wrap; }
    #conn.ok { color: #2a7d20; }
    #conn.bad { color: #b00; }
  </style>
</head>
<body>
  <header>
    <h1 id="heading">SFTP Transfer</h1>
    <span class="sub" id="info"></span>
  </header>

  <div class="tabs" id="tabs">
    <span class="tab sel" data-dest="put">Put Log <span class="state" id="state-put"></span><span class="badge" id="badge-put">0</span></span>
    <span class="tab" data-dest="get">Get Log <span class="state" id="state-get"></span><span class="badge" id="badge-get">0</span></span>
    <span class="tab" data-dest="sys">System Log <span class="badge" id="badge-sys">0</span></span>
  </div>

  <div class="controls">
    <input type="search" id="search" placeholder="Filter text (substring, case-insensitive)"/>
    <label><input type="checkbox" id="follow" checked/> Auto-scroll</label>
    <button id="clear" type="button">Clear</button>
    <span id="shown" class="sub"></span>
  </div>

  <div class="log sel" id="log-put"></div>
  <div class="log" id="log-get"></div>
  <div class="log" id="log-sys"></div>

  <footer>
    <span id="conn"></span>
    <span>Read only - this page shows the same lines as the Put Log, Get Log and System Log tabs of the desktop application.</span>
  </footer>

  <script>
  (function () {
    'use strict';

    var MAX_LINES = 2000;          // client-side cap per window
    var STATUS_INTERVAL_MS = 5000;
    var DESTS = ['put', 'get', 'sys'];

    var searchEl = document.getElementById('search');
    var followEl = document.getElementById('follow');
    var connEl = document.getElementById('conn');
    var shownEl = document.getElementById('shown');

    var selected = 'put';
    var buffers = { put: [], get: [], sys: [] };   // entries sorted by seq, oldest first
    var lastSeq = { put: 0, get: 0, sys: 0 };      // highest seq held per window
    var unseen = { put: 0, get: 0, sys: 0 };       // live arrivals on a tab that is not showing

    function logEl(dest) { return document.getElementById('log-' + dest); }

    function matches(entry) {
      var text = searchEl.value.trim().toLowerCase();
      if (text === '') return true;
      return (entry.time + ' ' + entry.msg).toLowerCase().indexOf(text) >= 0;
    }

    function rowFor(entry) {
      var div = document.createElement('div');
      div.className = 'l' + entry.level;
      var ts = document.createElement('span');
      ts.className = 'ts';
      ts.textContent = entry.time;
      div.appendChild(ts);
      div.appendChild(document.createTextNode(entry.msg));
      return div;
    }

    function atBottom(el) {
      return el.scrollHeight - el.scrollTop - el.clientHeight < 40;
    }

    function updateShown() {
      var el = logEl(selected);
      shownEl.textContent = el.childElementCount + ' of ' + buffers[selected].length + ' lines';
    }

    function trim(dest) {
      var list = buffers[dest];
      if (list.length > MAX_LINES) list.splice(0, list.length - MAX_LINES);
    }

    function render(dest) {
      var el = logEl(dest);
      var frag = document.createDocumentFragment();
      var list = buffers[dest];
      for (var i = 0; i < list.length; i++) {
        if (matches(list[i])) frag.appendChild(rowFor(list[i]));
      }
      el.textContent = '';
      el.appendChild(frag);
      if (followEl.checked) el.scrollTop = el.scrollHeight;
      if (dest === selected) updateShown();
    }

    function renderAll() {
      for (var i = 0; i < DESTS.length; i++) render(DESTS[i]);
    }

    function badge(dest) {
      var b = document.getElementById('badge-' + dest);
      b.textContent = unseen[dest];
      b.className = 'badge' + (unseen[dest] > 0 ? ' on' : '');
    }

    // Puts an entry into its window's sorted buffer. Returns false when that seq is already held.
    function insertSorted(dest, entry) {
      var list = buffers[dest];
      var lo = 0, hi = list.length;
      while (lo < hi) {
        var mid = (lo + hi) >> 1;
        if (list[mid].seq < entry.seq) lo = mid + 1; else hi = mid;
      }
      if (lo < list.length && list[lo].seq === entry.seq) return false;
      list.splice(lo, 0, entry);
      if (entry.seq > lastSeq[dest]) lastSeq[dest] = entry.seq;
      return true;
    }

    // A live frame from the stream: always newer than anything held, so append in place.
    function acceptLive(entry) {
      var dest = entry.dest;
      if (!buffers[dest] || entry.seq <= lastSeq[dest]) return;   // unknown window or already held
      buffers[dest].push(entry);
      lastSeq[dest] = entry.seq;
      trim(dest);

      if (dest !== selected) { unseen[dest]++; badge(dest); }

      if (!matches(entry)) { if (dest === selected) updateShown(); return; }

      var el = logEl(dest);
      var stick = followEl.checked || atBottom(el);
      el.appendChild(rowFor(entry));
      while (el.childElementCount > MAX_LINES) el.removeChild(el.firstChild);
      if (stick) el.scrollTop = el.scrollHeight;
      if (dest === selected) updateShown();
    }

    // A backlog fetched after the stream opened: merge by seq (live frames may already have
    // landed beyond it) and redraw that window once. History does not count as unseen.
    function acceptBacklog(dest, entries) {
      var added = 0;
      for (var i = 0; i < entries.length; i++) {
        if (entries[i].dest === dest && insertSorted(dest, entries[i])) added++;
      }
      if (added > 0) { trim(dest); render(dest); }
    }

    function select(dest) {
      selected = dest;
      unseen[dest] = 0;
      badge(dest);
      var tabs = document.querySelectorAll('.tab');
      for (var i = 0; i < tabs.length; i++) tabs[i].className = 'tab' + (tabs[i].getAttribute('data-dest') === dest ? ' sel' : '');
      for (var j = 0; j < DESTS.length; j++) logEl(DESTS[j]).className = 'log' + (DESTS[j] === dest ? ' sel' : '');
      var el = logEl(dest);
      if (followEl.checked) el.scrollTop = el.scrollHeight;
      updateShown();
    }

    async function loadBacklog(dest, after) {
      try {
        var res = await fetch('/api/log?dest=' + dest + '&after=' + after, { cache: 'no-store' });
        var data = await res.json();
        acceptBacklog(dest, data.entries);
      } catch (e) {
        acceptLive({ dest: dest, seq: lastSeq[dest] + 1, time: '', level: 2, msg: '[viewer] failed to load backlog: ' + e.message });
      }
    }

    // The "after" marks are taken before anything is awaited, so a live frame which lands
    // during the fetches cannot move a window's mark past history it has not yet received.
    function loadAllBacklogs() {
      var marks = { put: lastSeq.put, get: lastSeq.get, sys: lastSeq.sys };
      var jobs = [];
      for (var i = 0; i < DESTS.length; i++) jobs.push(loadBacklog(DESTS[i], marks[DESTS[i]]));
      return Promise.all(jobs);
    }

    async function refreshStatus() {
      try {
        var res = await fetch('/api/status', { cache: 'no-store' });
        var data = await res.json();
        document.getElementById('heading').textContent = data.appName + (data.title ? ' - ' + data.title : '');
        document.getElementById('info').textContent = 'version ' + data.appVersion;
        document.getElementById('state-put').textContent = '(' + data.putState + ')';
        document.getElementById('state-get').textContent = '(' + data.getState + ')';
        document.title = (data.title ? data.title + ' - ' : '') + 'SFTP Transfer Logs';
      } catch (e) {
        document.getElementById('info').textContent = 'status unavailable';
      }
    }

    document.getElementById('tabs').addEventListener('click', function (ev) {
      var t = ev.target.closest('.tab');
      if (t) select(t.getAttribute('data-dest'));
    });
    searchEl.addEventListener('input', renderAll);
    document.getElementById('clear').addEventListener('click', function () {
      buffers[selected] = [];
      render(selected);
    });

    (async function () {
      await refreshStatus();
      setInterval(refreshStatus, STATUS_INTERVAL_MS);

      var es = new EventSource('/events');
      es.onopen = function () {
        connEl.textContent = '● following';
        connEl.className = 'ok';
        // First open and every reconnect: recover what was missed.
        loadAllBacklogs();
      };
      es.onmessage = function (e) {
        try { acceptLive(JSON.parse(e.data)); } catch (err) { /* ignore a malformed frame */ }
      };
      es.onerror = function () { connEl.textContent = '● reconnecting…'; connEl.className = 'bad'; };
    })();
  })();
  </script>
</body>
</html>
