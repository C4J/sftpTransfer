<!DOCTYPE html>
<!-- Read-only web view of the sftpTransfer log: the Put, Get and System lines merged
     into one list by sequence number, each prefixed [PUT], [GET] or [SYS] - the same
     view as the desktop application's log panel.

     Follows new entries on the /events SSE stream. Each time that stream (re)opens the
     page fetches the three backlogs from /api/log?dest=...&after=<highest seq held at
     that moment> and merges them in by sequence number, so lines written while the
     browser was away are recovered (up to the server's per-log buffer), and live frames
     which arrive while a backlog fetch is still in flight do not hide it. -->
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SFTP Transfer - Log</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 1rem 1.25rem;
      color: #222; background: #f5f6f8;
    }
    header { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; margin-bottom: .6rem; }
    h1 { font-size: 1.2rem; margin: 0; }
    .sub { font-size: .85rem; color: #666; }
    .state { font-size: .72rem; color: #666; font-weight: normal; }

    .controls { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: .5rem; font-size: .85rem; }
    .controls input[type=search] { padding: .3rem .5rem; border: 1px solid #ccd0d6; border-radius: 4px; min-width: 15rem; font-size: .85rem; }
    .controls label { color: #555; display: inline-flex; align-items: center; gap: .3rem; }
    .controls .sources { display: inline-flex; gap: .6rem; padding-right: .6rem; border-right: 1px solid #ccd0d6; }
    .controls select { padding: .3rem .4rem; border: 1px solid #ccd0d6; border-radius: 4px; font-size: .85rem; background: #fff; }
    button { font-size: .85rem; padding: .3rem .7rem; border: 1px solid #ccd0d6; background: #fff; border-radius: 4px; cursor: pointer; }
    button:hover { border-color: #8a9099; }

    /* Same colours as the desktop log rows (JLogRow). */
    .log {
      background: #fff; border: 1px solid #ccd0d6; font-family: Arial, Helvetica, sans-serif;
      font-size: .82rem; line-height: 1.5; padding: .5rem .6rem; border-radius: 4px;
      height: 76vh; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    }
    .log .ts { color: #777; margin-right: .6rem; }
    .log .l0 { color: #0000ff; }
    .log .l1 { color: #dc582a; }
    .log .l2 { color: #ff0000; }
    .log .l3 { color: #000000; }
    .log .l4 { color: #009900; }
    .log .l5 { color: #808080; }

    footer { margin-top: .5rem; font-size: .8rem; color: #666; display: flex; gap: 1rem; flex-wrap: wrap; }
    #conn.ok { color: #2a7d20; }
    #conn.bad { color: #b00; }
  </style>
</head>
<body>
  <header>
    <h1 id="heading">SFTP Transfer</h1>
    <span class="sub" id="info"></span>
  </header>

  <div class="controls">
    <label>Log Level
      <select id="level" title="Detail shown - Debug adds the polling of the remote folders. Remembered by this browser.">
        <option value="0">Errors only</option>
        <option value="1">Warnings and errors</option>
        <option value="2" selected>Normal</option>
        <option value="3">Debug</option>
      </select>
    </label>
    <span class="sources">
      <label title="Show the System log lines"><input type="checkbox" id="show-sys" data-dest="sys" checked/> System</label>
      <label title="Show the Put log lines"><input type="checkbox" id="show-put" data-dest="put" checked/> Put <span class="state" id="state-put"></span></label>
      <label title="Show the Get log lines"><input type="checkbox" id="show-get" data-dest="get" checked/> Get <span class="state" id="state-get"></span></label>
    </span>
    <input type="search" id="search" placeholder="Filter text (substring, case-insensitive)"/>
    <label><input type="checkbox" id="follow" checked/> Auto-scroll</label>
    <button id="clear" type="button">Clear</button>
    <span id="shown" class="sub"></span>
  </div>

  <div class="log" id="log"></div>

  <footer>
    <span id="conn"></span>
    <span>Read only - this page shows the same lines as the log panel of the desktop application, with the same [PUT], [GET] and [SYS] prefixes. The Log Level and the three boxes here are this browser's own and re-filter the lines already held.</span>
  </footer>

  <script>
  (function () {
    'use strict';

    var MAX_LINES = 3000;          // client-side cap for the merged list
    var STATUS_INTERVAL_MS = 5000;
    var DESTS = ['put', 'get', 'sys'];
    var TAG = { put: '[PUT] ', get: '[GET] ', sys: '[SYS] ' };   // same prefixes as the desktop panel and the log file

    var searchEl = document.getElementById('search');
    var levelEl = document.getElementById('level');
    var followEl = document.getElementById('follow');
    var connEl = document.getElementById('conn');
    var shownEl = document.getElementById('shown');
    var logEl = document.getElementById('log');

    // Display level, same table as the desktop (JLogPanel.shows): row types are
    // 0 normal, 1 warn, 2 error, 3 info, 4 directory, 5 debug; levels run
    // 0 errors only, 1 warnings and errors, 2 normal, 3 debug.
    var LEVEL_KEY = 'sftpTransfer.logLevel';
    var level = 2;
    try {
      var savedLevel = window.localStorage.getItem(LEVEL_KEY);
      if (savedLevel !== null && /^[0-3]$/.test(savedLevel)) level = Number(savedLevel);
    } catch (e) { /* storage unavailable (private window) - stay on Normal */ }
    levelEl.value = String(level);

    function shows(rowType) {
      switch (rowType) {
        case 2: return true;
        case 1: return level >= 1;
        case 5: return level >= 3;
        default: return level >= 2;
      }
    }

    // Which logs are shown - all three at every load, like the desktop boxes (not remembered).
    var show = { put: true, get: true, sys: true };

    var buffer = [];      // entries from all three logs sorted by seq, oldest first
    var lastSeq = 0;      // highest seq held

    function matches(entry) {
      if (!show[entry.dest]) return false;
      if (!shows(entry.level)) return false;
      var text = searchEl.value.trim().toLowerCase();
      if (text === '') return true;
      return (entry.time + ' ' + TAG[entry.dest] + entry.msg).toLowerCase().indexOf(text) >= 0;
    }

    function rowFor(entry) {
      var div = document.createElement('div');
      div.className = 'l' + entry.level + ' d-' + entry.dest;
      var ts = document.createElement('span');
      ts.className = 'ts';
      ts.textContent = entry.time;
      div.appendChild(ts);
      div.appendChild(document.createTextNode(TAG[entry.dest] + entry.msg));
      return div;
    }

    function atBottom(el) {
      return el.scrollHeight - el.scrollTop - el.clientHeight < 40;
    }

    function updateShown() {
      shownEl.textContent = logEl.childElementCount + ' of ' + buffer.length + ' lines';
    }

    function trim() {
      if (buffer.length > MAX_LINES) buffer.splice(0, buffer.length - MAX_LINES);
    }

    function render() {
      var frag = document.createDocumentFragment();
      for (var i = 0; i < buffer.length; i++) {
        if (matches(buffer[i])) frag.appendChild(rowFor(buffer[i]));
      }
      logEl.textContent = '';
      logEl.appendChild(frag);
      if (followEl.checked) logEl.scrollTop = logEl.scrollHeight;
      updateShown();
    }

    // Puts an entry into the sorted buffer. Returns false when that seq is already held.
    function insertSorted(entry) {
      var lo = 0, hi = buffer.length;
      while (lo < hi) {
        var mid = (lo + hi) >> 1;
        if (buffer[mid].seq < entry.seq) lo = mid + 1; else hi = mid;
      }
      if (lo < buffer.length && buffer[lo].seq === entry.seq) return false;
      buffer.splice(lo, 0, entry);
      if (entry.seq > lastSeq) lastSeq = entry.seq;
      return true;
    }

    // A live frame from the stream: always newer than anything held, so append in place.
    function acceptLive(entry) {
      if (!TAG[entry.dest] || entry.seq <= lastSeq) return;   // unknown log or already held
      buffer.push(entry);
      lastSeq = entry.seq;
      trim();

      if (!matches(entry)) { updateShown(); return; }

      var stick = followEl.checked || atBottom(logEl);
      logEl.appendChild(rowFor(entry));
      while (logEl.childElementCount > MAX_LINES) logEl.removeChild(logEl.firstChild);
      if (stick) logEl.scrollTop = logEl.scrollHeight;
      updateShown();
    }

    // A backlog fetched after the stream opened: merge by seq (live frames may already have
    // landed beyond it) and redraw once.
    function acceptBacklog(entries) {
      var added = 0;
      for (var i = 0; i < entries.length; i++) {
        if (TAG[entries[i].dest] && insertSorted(entries[i])) added++;
      }
      if (added > 0) { trim(); render(); }
    }

    async function loadBacklog(dest, after) {
      try {
        var res = await fetch('/api/log?dest=' + dest + '&after=' + after, { cache: 'no-store' });
        var data = await res.json();
        acceptBacklog(data.entries);
      } catch (e) {
        acceptLive({ dest: dest, seq: lastSeq + 1, time: '', level: 2, msg: '[viewer] failed to load backlog: ' + e.message });
      }
    }

    // The "after" mark is taken before anything is awaited, so a live frame which lands
    // during the fetches cannot move the mark past history not yet received. One mark
    // serves all three logs: the sequence is global, so anything above it is missing.
    function loadAllBacklogs() {
      var mark = lastSeq;
      var jobs = [];
      for (var i = 0; i < DESTS.length; i++) jobs.push(loadBacklog(DESTS[i], mark));
      return Promise.all(jobs);
    }

    async function refreshStatus() {
      try {
        var res = await fetch('/api/status', { cache: 'no-store' });
        var data = await res.json();
        document.getElementById('heading').textContent = data.appName + (data.title ? ' - ' + data.title : '');
        document.getElementById('info').textContent = 'version ' + data.appVersion;
        document.getElementById('state-put').textContent = '(' + data.putState + ')';
        document.getElementById('state-get').textContent = '(' + data.getState + ')';
        document.title = (data.title ? data.title + ' - ' : '') + 'SFTP Transfer Log';
      } catch (e) {
        document.getElementById('info').textContent = 'status unavailable';
      }
    }

    searchEl.addEventListener('input', render);
    levelEl.addEventListener('change', function () {
      level = Number(levelEl.value);
      try { window.localStorage.setItem(LEVEL_KEY, String(level)); } catch (e) { /* not remembered, still applied */ }
      render();
    });
    for (var d = 0; d < DESTS.length; d++) {
      document.getElementById('show-' + DESTS[d]).addEventListener('change', function (ev) {
        show[ev.target.getAttribute('data-dest')] = ev.target.checked;
        render();
      });
    }
    document.getElementById('clear').addEventListener('click', function () {
      buffer = [];
      render();
    });

    (async function () {
      await refreshStatus();
      setInterval(refreshStatus, STATUS_INTERVAL_MS);

      var es = new EventSource('/events');
      es.onopen = function () {
        connEl.textContent = '● following';
        connEl.className = 'ok';
        // First open and every reconnect: recover what was missed.
        loadAllBacklogs();
      };
      es.onmessage = function (e) {
        try { acceptLive(JSON.parse(e.data)); } catch (err) { /* ignore a malformed frame */ }
      };
      es.onerror = function () { connEl.textContent = '● reconnecting…'; connEl.className = 'bad'; };
    })();
  })();
  </script>
</body>
</html>
